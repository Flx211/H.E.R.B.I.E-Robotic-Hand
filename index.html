<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robotic Hand App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #F54927;
            color: rgb(252, 254, 255);   
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 5px;
            font-weight: 900;
        }
        p {
            font-size: 0.7rem;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .btn-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .action-btn {
            background-color: #ffbb00;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            max-height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            background: #000;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mirror {
            transform: scaleX(-1);
        }
        #status {
            font-size: 18px;
            font-weight: 700;
            margin-top: 15px;
            color: #00ffcc;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 style="font-size:40px;">Robotic Hand App </h1>
    <p>H.E.R.B.I.E INC | Coral Gables Senior Highschool | 2026-2027 </p>
    <br>

    <div class="btn-controls">
        <button id="bt-btn" class="action-btn">Connect to the Robotic Hand</button>
        <button id="switch-cam-btn" class="action-btn">Switch Camera</button>
    </div>

    <div id="container">
        <video id="webcam" class="mirror" autoplay playsinline muted></video>
        <canvas id="output_canvas" class="mirror"></canvas>
    </div>
    
    <div id="status">Loading J.A.R.V.I.S scanning protocol...</div>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const statusDiv = document.getElementById("status");
        const btBtn = document.getElementById("bt-btn");
        const switchCamBtn = document.getElementById("switch-cam-btn");

        let handLandmarker = undefined;
        let lastVideoTime = -1;
        let bleCharacteristic = null;
        let lastSentCommand = "";
        
        let currentFacingMode = "user";
        let animationFrameId = null;
        let isCameraRunning = false;

        btBtn.addEventListener("click", async () => {
            try {
                btBtn.innerText = "Linking with Robotic Hand";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "HERBIE_RoboticHand" }],
                    optionalServices: ["6e400001-b5a3-f393-e0a9-e50e24dcca9e"]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService("6e400001-b5a3-f393-e0a9-e50e24dcca9e");
                bleCharacteristic = await service.getCharacteristic("6e400002-b5a3-f393-e0a9-e50e24dcca9e");

                btBtn.innerText = "Connected!";
                btBtn.style.backgroundColor = "#00ff00";
            } catch (error) {
                console.error("Bluetooth error:", error);
                btBtn.innerText = "Connection Failed (Retry)";
            }
        });

        switchCamBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            
            if (currentFacingMode === "user") {
                video.classList.add("mirror");
                canvasElement.classList.add("mirror");
            } else {
                video.classList.remove("mirror");
                canvasElement.classList.remove("mirror");
            }

            if (isCameraRunning) {
                startWebcam();
            }
        });

        async function sendBluetoothCommand(val) {
            if (!bleCharacteristic || val === lastSentCommand) return;
            lastSentCommand = val;
            try {
                const encoder = new TextEncoder();
                await bleCharacteristic.writeValue(encoder.encode(val));
            } catch (err) {
                console.log("BLE write error:", err);
            }
        }

        async function createHandLandmarker() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                );
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });
                statusDiv.innerText = "J.A.R.V.I.S has loaded correctly. Tap anywhere to Start Camera.";
            } catch (error) {
                statusDiv.innerText = "Error loading J.A.R.V.I.S";
                console.error(error);
            }
        }
        createHandLandmarker();

        document.body.addEventListener("click", (e) => {
            if (e.target === btBtn || e.target === switchCamBtn) return; 
            if (!isCameraRunning && handLandmarker) {
                startWebcam();
            }
        });

        function startWebcam() {
            statusDiv.innerText = "Switching/Scanning Surroundings...";
            isCameraRunning = true;

            // Stop any ongoing animation loop
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            // Stop active tracks
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }

            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: currentFacingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                } 
            }).then((stream) => {
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    canvasElement.width = video.videoWidth || video.clientWidth;
                    canvasElement.height = video.videoHeight || video.clientHeight;
                    lastVideoTime = -1; // Reset frame tracker to sync MediaPipe
                    predictWebcam();
                };
            }).catch((err) => {
                statusDiv.innerText = "Camera access denied or device unavailable.";
                isCameraRunning = false;
                console.error(err);
            });
        }

        async function predictWebcam() {
            if (!isCameraRunning) return;

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (handLandmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                try {
                    const results = handLandmarker.detectForVideo(video, performance.now());

                    if (results.landmarks && results.landmarks.length > 0) {
                        const landmarks = results.landmarks[0];
                        drawConnectors(canvasCtx, landmarks);

                        const tips = [8, 12, 16, 20];
                        const pips = [6, 10, 14, 18];
                        let closedCount = 0;

                        for (let i = 0; i < 4; i++) {
                            if (landmarks[tips[i]].y > landmarks[pips[i]].y) {
                                closedCount++;
                            }
                        }

                        if (closedCount >= 3) {
                            statusDiv.innerText = "Closed Hand";
                            statusDiv.style.color = "#aaaaaa";
                            sendBluetoothCommand("0");
                        } else {
                            statusDiv.innerText = "Open Hand";
                            statusDiv.style.color = "#00ffcc";
                            sendBluetoothCommand("1");
                        }
                    } else {
                        statusDiv.innerText = "No hand detected";
                        statusDiv.style.color = "#aaaaaa";
                    }
                } catch (e) {
                    console.error("Detection frame error:", e);
                }
            }
            animationFrameId = window.requestAnimationFrame(predictWebcam);
        }

        function drawConnectors(ctx, landmarks) {
            ctx.fillStyle = "#00FF00";
            for (let i = 0; i < landmarks.length; i++) {
                const x = landmarks[i].x * canvasElement.width;
                const y = landmarks[i].y * canvasElement.height;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, 2 * Math.PI);
                ctx.fill();
            }
        }
    </script>
</body>
</html>
